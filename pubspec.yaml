name: moonbase_skeleton
description: Flutter skeleton for MoonBase (closed-circle streaming/chat) with Firebase (Core/Auth/Firestore/Storage) foundation.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase (Phase 4 foundation). firebase_core must initialize before any
  # other Firebase plugin is used; see Firebase.initializeApp in main.dart.
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.5
  cloud_firestore: ^6.7.0
  firebase_storage: ^13.4.4

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  shared_preferences: ^2.3.2
  uuid: ^4.5.1

  # Keep dependencies minimal to avoid build issues
  cupertino_icons: ^1.0.8

  # Phase 3 (content features) — added in foundation slice.
  # See docs/PHASE3_DOD_ACTION_LIST.md §0.1.1.
  image_picker: ^1.1.2          # OS camera + gallery picker (used by ImagePickerMediaPicker)
  video_player: ^2.9.2          # Video playback for MediaPreview
  path_provider: ^2.1.4         # App documents dir for LocalFileMediaStorage
  mime: ^2.0.0                  # Content-type sniffing for MediaPickRequest validation (2.x required by firebase_storage)
  flutter_image_compress: ^2.3.0 # Optional: enforce imageMaxBytes via lossy compression
  app_settings: ^6.1.1          # POL-2: deep-link to OS app settings on permission denial

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  mocktail: ^1.0.3
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  assets:
  - assets/images/logo.png
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/roboto/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/roboto/Roboto-Thin.ttf
          weight: 100
        - asset: assets/fonts/roboto/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/roboto/Roboto-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/roboto/Roboto-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/roboto/Roboto-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/roboto/Roboto-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/roboto/Roboto-Black.ttf
          weight: 900
        - asset: assets/fonts/roboto/Roboto-BlackItalic.ttf
          weight: 900
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#5B8DEF"
  adaptive_icon_foreground: "assets/images/logo.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#5B8DEF"
    theme_color: "#5B8DEF"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"

