name: iOS repository preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".fvmrc"
      - ".github/workflows/ios.yml"
      - "android/app/build.gradle.kts"
      - "android/app/google-services.json"
      - "firebase.json"
      - "ios/**"
      - "lib/**"
      - "pubspec.lock"
      - "pubspec.yaml"
      - "test/**"
      - "tool/validate_ios_readiness.dart"
  push:
    branches:
      - main
    paths:
      - ".fvmrc"
      - ".github/workflows/ios.yml"
      - "android/app/build.gradle.kts"
      - "android/app/google-services.json"
      - "firebase.json"
      - "ios/**"
      - "lib/**"
      - "pubspec.lock"
      - "pubspec.yaml"
      - "test/**"
      - "tool/validate_ios_readiness.dart"

permissions:
  contents: read

concurrency:
  group: ios-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
      
      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Install FVM
        run: brew install fvm

      - name: Install pinned Flutter SDK
        run: fvm install

      - name: Verify pinned toolchain
        run: |
          fvm flutter --version
          fvm dart --version

      - name: Resolve Flutter packages
        run: fvm flutter pub get

      - name: Validate repository-side iOS configuration
        run: >-
          fvm dart run tool/validate_ios_readiness.dart
          --allow-pending-firebase-registration

      - name: Validate committed Firebase iOS configuration
        if: ${{ hashFiles('ios/Runner/GoogleService-Info.plist') != '' }}
        run: fvm dart run tool/validate_ios_readiness.dart

      - name: Analyze
        run: fvm flutter analyze

      - name: Run Flutter tests
        run: fvm flutter test

      - name: Precache iOS engine artifacts
        run: fvm flutter precache --ios
    
      - name: Install pinned CocoaPods
        run: sudo gem install cocoapods -v 1.17.0 --no-document
        
      - name: Show CocoaPods version
        run: pod --version

      - name: Resolve CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build unsigned debug app
        run: fvm flutter build ios --debug --no-codesign

      - name: Require committed CocoaPods integration
        shell: bash
        run: |
          if [[ ! -f ios/Podfile.lock ]] ||
             ! git ls-files --error-unmatch ios/Podfile.lock >/dev/null 2>&1; then
            echo "::error::pod install created or requires an uncommitted ios/Podfile.lock."
            echo "Run the documented Mac integration loop and commit every intended tracked iOS change."
            git status --short --untracked-files=all -- ios
            exit 1
          fi
          
          # Checksums of local :path pods (Flutter plugins) are a hash of the
          # podspec as evaluated by the local Ruby, so they differ between the
          # Mac's Ruby and the runner's. Plugin versions are pinned by
          # pubspec.lock, so mask only those lines; everything else must match.
          normalize() {
            awk '
              /^EXTERNAL SOURCES:/ { sec = "ext"; print; next }
              /^SPEC CHECKSUMS:/   { sec = "sum"; print; next }
              /^[^ ]/              { sec = "" }
              sec == "ext" && /^  [^ ]/ { n = $1; sub(/:$/, "", n); gsub(/"/, "", n); local_pod[n] = 1 }
              sec == "sum" && /^  [^ ]/ { n = $1; sub(/:$/, "", n); gsub(/"/, "", n)
                                         if (n in local_pod) { print "  " n ": <local>"; next } }
              { print }
            '
          }

          if ! diff -u <(git show HEAD:ios/Podfile.lock | normalize) \
                       <(normalize < ios/Podfile.lock); then
            echo "::error::Podfile.lock drifted beyond local plugin checksums."
            exit 1
          fi

          ios_status="$(git status --porcelain=v1 --untracked-files=all -- ios ':!ios/Podfile.lock')"
          if [[ -n "$ios_status" ]]; then
            echo "::error::CocoaPods or the iOS build left uncommitted tracked/trackable iOS changes."
            echo "$ios_status"
            git diff -- ios ':!ios/Podfile.lock'
            exit 1
          fi
