name: iOS repository preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".fvmrc"
      - ".github/workflows/ios.yml"
      - "android/app/build.gradle.kts"
      - "android/app/google-services.json"
      - "firebase.json"
      - "ios/**"
      - "lib/**"
      - "pubspec.lock"
      - "pubspec.yaml"
      - "test/**"
      - "tool/validate_ios_readiness.dart"
  push:
    branches:
      - main
    paths:
      - ".fvmrc"
      - ".github/workflows/ios.yml"
      - "android/app/build.gradle.kts"
      - "android/app/google-services.json"
      - "firebase.json"
      - "ios/**"
      - "lib/**"
      - "pubspec.lock"
      - "pubspec.yaml"
      - "test/**"
      - "tool/validate_ios_readiness.dart"

permissions:
  contents: read

concurrency:
  group: ios-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Install FVM
        run: brew install fvm

      - name: Install pinned Flutter SDK
        run: fvm install

      - name: Verify pinned toolchain
        run: |
          fvm flutter --version
          fvm dart --version

      - name: Resolve Flutter packages
        run: fvm flutter pub get

      - name: Validate repository-side iOS configuration
        run: >-
          fvm dart run tool/validate_ios_readiness.dart
          --allow-pending-firebase-registration

      - name: Validate committed Firebase iOS configuration
        if: ${{ hashFiles('ios/Runner/GoogleService-Info.plist') != '' }}
        run: fvm dart run tool/validate_ios_readiness.dart

      - name: Analyze
        run: fvm flutter analyze

      - name: Run Flutter tests
        run: fvm flutter test

      - name: Resolve CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build unsigned debug app
        run: fvm flutter build ios --debug --no-codesign

      - name: Require committed CocoaPods integration
        shell: bash
        run: |
          if [[ ! -f ios/Podfile.lock ]] ||
             ! git ls-files --error-unmatch ios/Podfile.lock >/dev/null 2>&1; then
            echo "::error::pod install created or requires an uncommitted ios/Podfile.lock."
            echo "Run the documented Mac integration loop and commit every intended tracked iOS change."
            git status --short --untracked-files=all -- ios
            exit 1
          fi

          ios_status="$(git status --porcelain=v1 --untracked-files=all -- ios)"
          if [[ -n "$ios_status" ]]; then
            echo "::error::CocoaPods or the iOS build left uncommitted tracked/trackable iOS changes."
            echo "$ios_status"
            git diff -- ios
            exit 1
          fi